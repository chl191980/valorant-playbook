<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>点位总览 QC</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #0b0e14; color: #dfe6ee;
         font: 12px/1.4 "Segoe UI", "Microsoft YaHei", sans-serif; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 8px; }
  .tile { background: #11151d; border: 1px solid #232b38; border-radius: 6px; overflow: hidden; }
  .cap { padding: 4px 6px; font-weight: 700; font-size: 12px; }
  .cap small { color: #7d8b9e; font-weight: 400; margin-left: 4px; }
  .cv { position: relative; width: 100%; aspect-ratio: 1 / 1; }
  .cv img { position: absolute; inset: 0; width: 100%; height: 100%; }
  .dot { position: absolute; width: 5px; height: 5px; border-radius: 50%;
         transform: translate(-50%, -50%); box-shadow: 0 0 0 1px #000a; }
  .dot.atk { box-shadow: 0 0 0 1px #fff6; }
  .dot.def { border: 1px solid #fff; }
  .dot::after { content: ''; }
  .site { position: absolute; transform: translate(-50%, -50%); font-size: 9px;
          color: #fff; background: #ff4655cc; padding: 0 3px; border-radius: 2px; }
</style>
</head>
<body>
<div class="grid" id="grid"></div>

<script src="../data/core.js"></script>
<script src="../data/tactics/ascent.js"></script>
<script src="../data/tactics/split.js"></script>
<script src="../data/tactics/haven.js"></script>
<script src="../data/tactics/bind.js"></script>
<script src="../data/tactics/sunset.js"></script>
<script src="../data/tactics/lotus.js"></script>
<script src="../data/tactics/pearl.js"></script>
<script src="../data/tactics/icebox.js"></script>
<script src="../data/tactics/breeze.js"></script>
<script src="../data/tactics/fracture.js"></script>
<script src="../data/tactics/abyss.js"></script>
<script src="../data/tactics/summit.js"></script>
<script src="../data/tactics/corrode.js"></script>
<script>
const COLOR = {
  smoke: '#a9bccd', molly: '#ff7a2f', flash: '#ffd84d', recon: '#4ad6ff',
  wall: '#5a8ce0', trap: '#cfc6ae', ult: '#c86bff', other: '#8ba0ad'
};
const T = window.TACTICS || {};
const grid = document.getElementById('grid');
for (const m of window.CORE.maps) {
  const t = T[m.slug];
  const tile = document.createElement('div');
  tile.className = 'tile';
  const n = t ? t.markers.length : 0;
  const s = t ? t.strats.length : 0;
  tile.innerHTML =
    '<div class="cap">' + m.zh + ' <small>' + m.slug + ' · ' + n + ' 点位 / ' + s + ' 打法' +
    (t ? '' : ' <b style="color:#ff4655">缺失</b>') + '</small></div>' +
    '<div class="cv"><img src="../assets/maps/' + m.slug + '.png" alt=""></div>';
  grid.appendChild(tile);
  if (!t) continue;
  const cv = tile.querySelector('.cv');
  for (const k of t.markers) {
    const d = document.createElement('div');
    d.className = 'dot ' + (k.side === 'defense' ? 'def' : 'atk');
    d.style.left = k.x + '%';
    d.style.top = k.y + '%';
    d.style.background = COLOR[k.ability] || '#fff';
    d.title = k.id;
    cv.appendChild(d);
  }
}
</script>
</body>
</html>
